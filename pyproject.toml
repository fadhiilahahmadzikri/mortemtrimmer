[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosilenttrimmer"
version = "1.0.0"
description = "Cross-Platform AI-Powered Silence Remover & Noise Reduction Production Suite"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
  { name = "Fadhiilah Ahmad Zikri", email = "134697481+fadhiilahahmadzikri@users.noreply.github.com" }
]
dependencies = [
  "av>=12.0.0",
  "numpy>=1.22,<2.0",
  "soundfile>=0.12,<0.13",
  "imageio-ffmpeg>=0.6.0",
  "platformdirs>=4.0.0",
  "httpx>=0.27.0",
  "filelock>=3.13.0",
  "psutil>=5.9.0",
  "pystray>=0.19.5",
  "Pillow>=10.0.0",
  "desktop-notifier>=6.0.0",
  "cryptography>=42.0.0",
  "packaging>=23.0,<24.0",
  "PyQt6>=6.7.0",
]

[project.optional-dependencies]
ai = [
  "torch>=2.2.0,<2.9.0",
  "torchaudio>=2.2.0,<2.9.0",
  "noisereduce>=3.0.0",
  "deepfilternet>=0.5.6",
  "faster-whisper>=1.0.0",
  "onnxruntime>=1.16.0,<2.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "tqdm>=4.66.0",
]
packaging = [
  "pyinstaller>=6.10.0",
  "pip-licenses>=5.0.0",
]
dev = [
  "pre-commit>=4.0.0",
  "ruff>=0.14.0",
  "commitizen>=3.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/fadhiilahahmadzikri/mortemtrimmer"
Repository = "https://github.com/fadhiilahahmadzikri/mortemtrimmer"
Issues = "https://github.com/fadhiilahahmadzikri/mortemtrimmer/issues"

[project.scripts]
autosilenttrimmer = "autosilenttrimmer.presentation.cli.runner:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["autosilenttrimmer*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["autosilenttrimmer", "scripts", "packaging", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # do not perform function calls in argument defaults
  "UP036", # version block check in diagnostic probe
]

[tool.ruff.lint.per-file-ignores]
"autosilenttrimmer/infrastructure/diagnostics/engines.py" = ["F401"]
"scripts/*" = ["E402"]
"packaging/*" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "unit: fast isolated unit tests without FFmpeg or OS-wide dependencies",
  "integration: cross-component integration tests using IPC, HTTP, or FFmpeg",
  "slow: multi-second media encode/decode or heavy real-sample tests",
]

[tool.coverage.run]
source = ["autosilenttrimmer"]
omit = [
  "autosilenttrimmer/__main__.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
annotated_tag = true
version_files = [
  "pyproject.toml:version",
  "autosilenttrimmer/branding.py:APP_VERSION",
  "packaging/windows/installer.iss:#define MyAppVersion",
  "CITATION.cff:version:",
]
